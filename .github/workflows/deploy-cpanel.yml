name: Deploy to cPanel

on:
  workflow_dispatch:
    inputs:
      target_domain:
        description: 'Choose deployment target:'
        required: true
        type: choice
        default: 'embeddedindia.in'
        options:
          - 'embeddedindia.in'
          - 'new.embeddedindia.in'

  push:
    branches:
      - main       # Auto-deploys to embeddedindia.in
      - develop    # Auto-deploys to new.embeddedindia.in

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cPanel Git Pull & Deployment
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_USER: "jiazxebj"
        run: |
          # 1. Resolve domain from manual selection or pushed branch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_DOMAIN="${{ inputs.target_domain }}"
          else
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              TARGET_DOMAIN="embeddedindia.in"
            else
              TARGET_DOMAIN="new.embeddedindia.in"
            fi
          fi

          # 2. Map domain to directory root
          if [ "$TARGET_DOMAIN" = "embeddedindia.in" ]; then
            REPO_PATH="/home/${CPANEL_USER}/embeddedindia.in"
          else
            REPO_PATH="/home/${CPANEL_USER}/new"
          fi

          echo "Target Domain: $TARGET_DOMAIN"
          echo "Repository Path: $REPO_PATH"

          # 3. Pull latest commits into the selected folder
          echo "Pulling latest code..."
          PULL_RES=$(curl -s -k -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            "https://${CPANEL_HOST}:2083/execute/VersionControl/update?repository_root=${REPO_PATH}")
          echo "Pull response: $PULL_RES"

          if echo "$PULL_RES" | grep -q '"status":0'; then
            echo "Error during pull."
            exit 1
          fi

          # 4. Trigger deployment via .cpanel.yml
          echo "Executing cPanel deployment tasks..."
          DEPLOY_RES=$(curl -s -k -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            "https://${CPANEL_HOST}:2083/execute/VersionControlDeployment/create?repository_root=${REPO_PATH}")
          echo "Deploy response: $DEPLOY_RES"

          if echo "$DEPLOY_RES" | grep -q '"status":0'; then
            echo "Error during deployment execution."
            exit 1
          fi

          echo "Deployment triggered successfully for $TARGET_DOMAIN."