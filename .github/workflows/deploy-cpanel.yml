name: Deploy to cPanel

on:
  workflow_dispatch:
    inputs:
      target_domain:
        description: 'Select target domain to update:'
        required: true
        type: choice
        default: 'embeddedindia.in'
        options:
          - 'embeddedindia.in'
          - 'new.embeddedindia.in'

  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cPanel Git Pull & Deployment
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_USER: "jiazxebj"
        run: |
          # 1. Determine target domain (defaults to embeddedindia.in on normal git push to main)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_DOMAIN="${{ inputs.target_domain }}"
          else
            TARGET_DOMAIN="embeddedindia.in"
          fi

          # 2. Map domain to the cPanel repository root
          if [ "$TARGET_DOMAIN" = "embeddedindia.in" ]; then
            REPO_PATH="/home/${CPANEL_USER}/embeddedindia.in"
          else
            REPO_PATH="/home/${CPANEL_USER}/new"
          fi

          echo "Deploying to: $TARGET_DOMAIN ($REPO_PATH)"

          # 3. Pull latest commit into the target repository directory
          PULL_RES=$(curl -s -k -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            "https://${CPANEL_HOST}:2083/execute/VersionControl/update?repository_root=${REPO_PATH}")
          echo "Pull response: $PULL_RES"

          if echo "$PULL_RES" | grep -q '"status":0'; then
            echo "Error: cPanel Git pull failed."
            exit 1
          fi

          # 4. Trigger .cpanel.yml deployment in that directory
          DEPLOY_RES=$(curl -s -k -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            "https://${CPANEL_HOST}:2083/execute/VersionControlDeployment/create?repository_root=${REPO_PATH}")
          echo "Deploy response: $DEPLOY_RES"

          if echo "$DEPLOY_RES" | grep -q '"status":0'; then
            echo "Error: cPanel deployment task failed."
            exit 1
          fi

          echo "Queued deployment for $TARGET_DOMAIN. Waiting 25s for build and Passenger restart..."
          sleep 25
          echo "Done! https://$TARGET_DOMAIN is updated."