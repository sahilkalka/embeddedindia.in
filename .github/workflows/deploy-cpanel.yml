name: Deploy to cPanel (embeddedindia.in)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Build Environment)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pre-build Production Assets & Pack Release (Zero Server-Side Build)
        run: |
          npm ci || npm install
          npm run build
          node --check app.js
          node --check src/server.js
          npm run pack:cpanel
          ls -lh embeddedindia.zip

      - name: Push Release & Deploy to cPanel
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_API_TOKEN || secrets.CPANEL_TOKEN }}
          CPANEL_USER: "jiazxebj"
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_SSH_PORT || secrets.CPANEL_PORT || '22' }}
          NOTIFY_EMAIL: "sahil.kalka@gmail.com"
        run: |
          set -e

          # Sanitize cPanel host
          CLEAN_HOST=$(echo "${CPANEL_HOST}" | sed -e 's|^https\?://||' -e 's|:[0-9]*||' -e 's|/.*||' | tr -d '[:space:]')
          if [ -z "$CLEAN_HOST" ]; then
            CLEAN_HOST="cpanel.embeddedindia.in"
          fi

          DOMAIN="embeddedindia.in"
          REL_DIR="embeddedindia.in"
          REPO_PATH="/home/${CPANEL_USER}/${REL_DIR}"
          ZIP_NAME="embeddedindia.zip"

          echo "=========================================================="
          echo "🚀 Deploy Target: https://${DOMAIN}"
          echo "📁 Target Directory: ${REPO_PATH}"
          echo "🌐 Host: https://${CLEAN_HOST}:2083"
          echo "👤 User: ${CPANEL_USER}"
          echo "📦 Pre-built Package: ${ZIP_NAME} ($(du -h ${ZIP_NAME} | cut -f1))"
          echo "=========================================================="

          DEPLOYED=false

          # -----------------------------------------------------------
          # Strategy 1: Direct File Push via cPanel UAPI (Zero Server-Side Build)
          # Pushes pre-built bundle directly over cPanel HTTPS (port 2083),
          # extracts atomically, touches restart marker, and runs server-deploy.
          # -----------------------------------------------------------
          if [ -n "${CPANEL_TOKEN}" ]; then
            echo "Initiating direct push deployment via cPanel API..."
            DEPLOY_ID="$(date +%s)-$(head -c 6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
            DEPLOY_TS="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

            # Step 1: Upload pre-built embeddedindia.zip to REPO_PATH
            echo "1. Uploading pre-built release package..."
            UPLOAD_RES=$(curl -s -S -k \
              -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
              -F "dir=${REPO_PATH}" \
              -F "overwrite=1" \
              -F "file-1=@${ZIP_NAME}" \
              "https://${CLEAN_HOST}:2083/execute/Fileman/upload_files" 2>&1 || true)

            echo "Upload Response (App Root):"
            echo "$UPLOAD_RES"
            echo "--- UPLOAD for ${DOMAIN} ---" >> cpanel_debug.log
            echo "$UPLOAD_RES" >> cpanel_debug.log

            if echo "$UPLOAD_RES" | grep -qE '"status"\s*:\s*1'; then
              echo "✅ Pre-built bundle uploaded to ${REPO_PATH}."

              # Also upload a copy to user home /home/${CPANEL_USER} as fallback source
              curl -s -S -k \
                -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
                -F "dir=/home/${CPANEL_USER}" \
                -F "overwrite=1" \
                -F "file-1=@${ZIP_NAME}" \
                "https://${CLEAN_HOST}:2083/execute/Fileman/upload_files" >/dev/null 2>&1 || true

              # Ensure app root has writable directory permissions before extraction
              curl -s -S -k --get \
                -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
                --data-urlencode "cpanel_jsonapi_user=${CPANEL_USER}" \
                --data-urlencode "cpanel_jsonapi_apiversion=2" \
                --data-urlencode "cpanel_jsonapi_module=Fileman" \
                --data-urlencode "cpanel_jsonapi_func=fileop" \
                --data-urlencode "op=chmod" \
                --data-urlencode "sourcefiles=${REPO_PATH}" \
                --data-urlencode "metadata=0755" \
                "https://${CLEAN_HOST}:2083/json-api/cpanel" >/dev/null 2>&1 || true

              # Step 2: Extract embeddedindia.zip directly into REPO_PATH using cPanel API 2 Fileman::fileop
              # IMPORTANT: cPanel API 2 Fileman::fileop requires 'destfiles' (not 'dest') for the target directory!
              echo "2. Extracting package files into ${REPO_PATH}..."
              EXTRACT_SUCCESS=false

              echo "Attempting cPanel API 2 Fileman::fileop extract (sourcefiles=${REPO_PATH}/${ZIP_NAME} -> destfiles=${REPO_PATH})..."
              EXTRACT_RES=$(curl -s -S -k --get \
                -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
                --data-urlencode "cpanel_jsonapi_user=${CPANEL_USER}" \
                --data-urlencode "cpanel_jsonapi_apiversion=2" \
                --data-urlencode "cpanel_jsonapi_module=Fileman" \
                --data-urlencode "cpanel_jsonapi_func=fileop" \
                --data-urlencode "op=extract" \
                --data-urlencode "sourcefiles=${REPO_PATH}/${ZIP_NAME}" \
                --data-urlencode "destfiles=${REPO_PATH}" \
                --data-urlencode "doubledecode=0" \
                "https://${CLEAN_HOST}:2083/json-api/cpanel" 2>&1 || true)

              if echo "$EXTRACT_RES" | grep -qE '"result"\s*:\s*1' && ! echo "$EXTRACT_RES" | grep -qiE 'Permission denied|cannot create|checkdir error|cannot find|unzip:|"dest"\s*:\s*null'; then
                echo "✅ cPanel API 2 extract into ${REPO_PATH} succeeded."
                EXTRACT_SUCCESS=true
              else
                echo "Primary extract returned warnings/errors. Retrying with relative paths (${REL_DIR}/${ZIP_NAME} -> ${REL_DIR})..."
                EXTRACT_RES=$(curl -s -S -k --get \
                  -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
                  --data-urlencode "cpanel_jsonapi_user=${CPANEL_USER}" \
                  --data-urlencode "cpanel_jsonapi_apiversion=2" \
                  --data-urlencode "cpanel_jsonapi_module=Fileman" \
                  --data-urlencode "cpanel_jsonapi_func=fileop" \
                  --data-urlencode "op=extract" \
                  --data-urlencode "sourcefiles=${REL_DIR}/${ZIP_NAME}" \
                  --data-urlencode "destfiles=${REL_DIR}" \
                  --data-urlencode "doubledecode=0" \
                  "https://${CLEAN_HOST}:2083/json-api/cpanel" 2>&1 || true)

                if echo "$EXTRACT_RES" | grep -qE '"result"\s*:\s*1' && ! echo "$EXTRACT_RES" | grep -qiE 'Permission denied|cannot create|checkdir error|cannot find|unzip:|"dest"\s*:\s*null'; then
                  echo "✅ cPanel API 2 relative extract into ${REL_DIR} succeeded."
                  EXTRACT_SUCCESS=true
                else
                  echo "Retrying extract from home directory archive (/home/${CPANEL_USER}/${ZIP_NAME} -> ${REPO_PATH})..."
                  EXTRACT_RES=$(curl -s -S -k --get \
                    -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
                    --data-urlencode "cpanel_jsonapi_user=${CPANEL_USER}" \
                    --data-urlencode "cpanel_jsonapi_apiversion=2" \
                    --data-urlencode "cpanel_jsonapi_module=Fileman" \
                    --data-urlencode "cpanel_jsonapi_func=fileop" \
                    --data-urlencode "op=extract" \
                    --data-urlencode "sourcefiles=/home/${CPANEL_USER}/${ZIP_NAME}" \
                    --data-urlencode "destfiles=${REPO_PATH}" \
                    --data-urlencode "doubledecode=0" \
                    "https://${CLEAN_HOST}:2083/json-api/cpanel" 2>&1 || true)

                  if echo "$EXTRACT_RES" | grep -qE '"result"\s*:\s*1' && ! echo "$EXTRACT_RES" | grep -qiE 'Permission denied|cannot create|checkdir error|cannot find|unzip:|"dest"\s*:\s*null'; then
                    echo "✅ cPanel API 2 extract from home directory succeeded."
                    EXTRACT_SUCCESS=true
                  fi
                fi
              fi

              echo "Extract Response:"
              echo "$EXTRACT_RES" | head -c 2500
              echo ""
              echo "--- EXTRACT for ${DOMAIN} ---" >> cpanel_debug.log
              echo "$EXTRACT_RES" >> cpanel_debug.log

              if [ "$EXTRACT_SUCCESS" = true ]; then
                # Write public/deployment-version.json via UAPI Fileman::save_file_content (parameter is 'file', not 'filename')
                curl -s -S -k \
                  -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
                  --data-urlencode "dir=${REPO_PATH}/public" \
                  --data-urlencode "file=deployment-version.json" \
                  --data-urlencode "content={\"id\":\"${DEPLOY_ID}\",\"domain\":\"${DOMAIN}\",\"deployedAt\":\"${DEPLOY_TS}\"}" \
                  "https://${CLEAN_HOST}:2083/execute/Fileman/save_file_content" >/dev/null 2>&1 || true

                # Step 3: Trigger cPanel .cpanel.yml deployment task
                echo "3. Triggering .cpanel.yml deployment task..."
                DEPLOY_RES=$(curl -s -S -k \
                  -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
                  --data-urlencode "repository_root=${REPO_PATH}" \
                  "https://${CLEAN_HOST}:2083/execute/VersionControlDeployment/create" 2>&1 || true)

                echo "Deployment Task Response:"
                echo "$DEPLOY_RES"
                echo "--- DEPLOY TASK for ${DOMAIN} ---" >> cpanel_debug.log
                echo "$DEPLOY_RES" >> cpanel_debug.log

                # Step 4: Ensure tmp directory exists (via API 2 Fileman::mkdir) & touch tmp/restart.txt (via UAPI Fileman::save_file_content with 'file=restart.txt')
                echo "4. Reloading Phusion Passenger via restart marker..."
                curl -s -S -k --get \
                  -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
                  --data-urlencode "cpanel_jsonapi_user=${CPANEL_USER}" \
                  --data-urlencode "cpanel_jsonapi_apiversion=2" \
                  --data-urlencode "cpanel_jsonapi_module=Fileman" \
                  --data-urlencode "cpanel_jsonapi_func=mkdir" \
                  --data-urlencode "path=${REPO_PATH}" \
                  --data-urlencode "name=tmp" \
                  "https://${CLEAN_HOST}:2083/json-api/cpanel" >/dev/null 2>&1 || true

                RESTART_RES=$(curl -s -S -k \
                  -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
                  --data-urlencode "dir=${REPO_PATH}/tmp" \
                  --data-urlencode "file=restart.txt" \
                  --data-urlencode "content=Deployment timestamp: ${DEPLOY_TS} (${DEPLOY_ID})" \
                  "https://${CLEAN_HOST}:2083/execute/Fileman/save_file_content" 2>&1 || true)

                echo "Restart Response: $RESTART_RES"

                # Step 5: Clean up uploaded zip files via cPanel API 2 Fileman::fileop (op=unlink)
                echo "5. Cleaning up temporary upload archive..."
                curl -s -S -k --get \
                  -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
                  --data-urlencode "cpanel_jsonapi_user=${CPANEL_USER}" \
                  --data-urlencode "cpanel_jsonapi_apiversion=2" \
                  --data-urlencode "cpanel_jsonapi_module=Fileman" \
                  --data-urlencode "cpanel_jsonapi_func=fileop" \
                  --data-urlencode "op=unlink" \
                  --data-urlencode "sourcefiles=${REPO_PATH}/${ZIP_NAME}" \
                  "https://${CLEAN_HOST}:2083/json-api/cpanel" >/dev/null 2>&1 || true

                curl -s -S -k --get \
                  -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
                  --data-urlencode "cpanel_jsonapi_user=${CPANEL_USER}" \
                  --data-urlencode "cpanel_jsonapi_apiversion=2" \
                  --data-urlencode "cpanel_jsonapi_module=Fileman" \
                  --data-urlencode "cpanel_jsonapi_func=fileop" \
                  --data-urlencode "op=unlink" \
                  --data-urlencode "sourcefiles=/home/${CPANEL_USER}/${ZIP_NAME}" \
                  "https://${CLEAN_HOST}:2083/json-api/cpanel" >/dev/null 2>&1 || true

                DEPLOYED=true
                echo "🎉 Push deployment completed successfully via cPanel API!"
              else
                echo "❌ ERROR: Archive extraction into ${REPO_PATH} failed. Falling back if SSH is available..."
              fi
            else
              echo "⚠️ File upload did not return status 1."
            fi
          fi

          # -----------------------------------------------------------
          # Strategy 2: Direct SSH Deployment Fallback
          # Only used if cPanel API push was not successful
          # -----------------------------------------------------------
          if [ "$DEPLOYED" = false ] && [ -n "${CPANEL_SSH_KEY}" ]; then
            echo "=========================================================="
            echo "Initiating direct SSH deployment fallback for ${REPO_PATH}..."
            echo "=========================================================="

            install -m 700 -d ~/.ssh
            printf '%s\n' "${CPANEL_SSH_KEY}" > ~/.ssh/cpanel_key
            chmod 600 ~/.ssh/cpanel_key

            SSH_PORT="${CPANEL_PORT}"
            if [[ "$SSH_PORT" == "2083" || "$SSH_PORT" == "2087" ]]; then
              SSH_PORT="22"
            fi

            # Cloudflare bypass: use CPANEL_SSH_HOST, or cpanel.subdomain, or CLEAN_HOST
            SSH_HOST="${CPANEL_SSH_HOST:-}"
            if [ -z "$SSH_HOST" ]; then
              if [[ "$CLEAN_HOST" == "embeddedindia.in" ]]; then
                SSH_HOST="cpanel.embeddedindia.in"
              else
                SSH_HOST="${CLEAN_HOST}"
              fi
            fi

            echo "Connecting via SSH to ${CPANEL_USER}@${SSH_HOST}:${SSH_PORT}..."
            ssh-keyscan -T 15 -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
            chmod 600 ~/.ssh/known_hosts

            cat > ~/.ssh/config <<EOF
          Host cpanel-direct
            HostName ${SSH_HOST}
            User ${CPANEL_USER}
            Port ${SSH_PORT}
            IdentityFile ~/.ssh/cpanel_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
            BatchMode yes
          EOF

            scp -o BatchMode=yes embeddedindia.zip "cpanel-direct:${REPO_PATH}/embeddedindia.zip"

            ssh cpanel-direct <<REMOTE_DEPLOY
            set -e
            cd "${REPO_PATH}"
            echo "Extracting release zip via server-deploy..."
            if [ -f server-deploy.sh ]; then
              chmod +x server-deploy.sh
              bash server-deploy.sh embeddedindia.in update "${REPO_PATH}/embeddedindia.zip"
            else
              unzip -o -q embeddedindia.zip
              touch tmp/restart.txt
            fi
            rm -f embeddedindia.zip
            echo "✅ Direct SSH deployment and Passenger reload complete!"
          REMOTE_DEPLOY

            DEPLOYED=true
          fi

          if [ "$DEPLOYED" = false ]; then
            echo "❌ ERROR: Deployment failed. Neither cPanel API push nor SSH succeeded."
            echo "Verify CPANEL_HOST and CPANEL_API_TOKEN in repository secrets."
            exit 1
          fi

          echo "Waiting 5s for Passenger restart to finish..."
          sleep 5

          # Step 6: Verify health check and live deployment marker
          echo "Verifying live service status at https://${DOMAIN}/health..."
          HEALTH_STATUS=$(curl -s -k -o /dev/null -w "%{http_code}" --max-time 15 "https://${DOMAIN}/health" || echo "000")
          echo "Health check HTTP status: ${HEALTH_STATUS}"
          LIVE_VER=$(curl -s -k --max-time 15 -H "Cache-Control: no-cache" "https://${DOMAIN}/deployment-version.json?t=$(date +%s)" || true)
          echo "Live deployment marker: ${LIVE_VER:-N/A}"

          echo "🎉 Deployment to https://${DOMAIN} completed successfully!"

      - name: Workflow Run Summary & Status Notice
        if: always()
        run: |
          echo "=========================================================="
          echo "GitHub Workflow Job Status: ${{ job.status }}"
          echo "Target Domain: embeddedindia.in"
          echo "Target Notification Email: sahil.kalka@gmail.com"
          echo "Zero Server-Side Build: Verified (pre-built assets pushed directly)"
          echo "=========================================================="

      - name: Upload Debug Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-debug-log
          path: cpanel_debug.log
