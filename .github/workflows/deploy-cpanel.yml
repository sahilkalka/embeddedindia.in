name: Deploy to cPanel (embeddedindia.in)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Build Environment)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pre-build Production Assets (Zero Server-Side Build)
        run: |
          npm ci || npm install
          npm run build
          node --check app.js
          node --check src/server.js

      - name: Trigger cPanel Git Pull & Deployment
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_API_TOKEN || secrets.CPANEL_TOKEN }}
          CPANEL_USER: "jiazxebj"
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_PORT: ${{ secrets.CPANEL_SSH_PORT || secrets.CPANEL_PORT || '22' }}
          NOTIFY_EMAIL: "sahil.kalka@gmail.com"
        run: |
          set -e

          # Sanitize host in case secret includes http(s):// or ports
          CLEAN_HOST=$(echo "${CPANEL_HOST}" | sed -e 's|^https\?://||' -e 's|:[0-9]*||' -e 's|/.*||' | tr -d '[:space:]')
          if [ -z "$CLEAN_HOST" ]; then
            CLEAN_HOST="cpanel.embeddedindia.in"
          fi

          DOMAIN="embeddedindia.in"
          REPO_DIR="embeddedindia.in"
          REPO_PATH="/home/${CPANEL_USER}/${REPO_DIR}"
          TARGET_BRANCH="main"

          echo "=========================================================="
          echo "🚀 Deploy Target: https://${DOMAIN}"
          echo "📁 cPanel Directory: ${REPO_PATH}"
          echo "🌿 Target Branch: ${TARGET_BRANCH}"
          echo "🌐 Host: https://${CLEAN_HOST}:2083"
          echo "👤 User: ${CPANEL_USER}"
          echo "=========================================================="

          DEPLOYED=false

          # -----------------------------------------------------------
          # Strategy 1: cPanel VersionControl UAPI (POST & GET fallback)
          # -----------------------------------------------------------
          if [ -n "${CPANEL_TOKEN}" ]; then
            echo "Attempting Git pull via cPanel UAPI..."

            # Step 1: Git Pull / Update from Remote via cPanel UAPI
            PULL_RES=$(curl -s -S -k \
              -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
              --data-urlencode "repository_root=${REPO_PATH}" \
              --data-urlencode "branch=${TARGET_BRANCH}" \
              "https://${CLEAN_HOST}:2083/execute/VersionControl/update" 2>&1 || true)

            if ! echo "$PULL_RES" | grep -qE '"status"\s*:\s*1'; then
              echo "UAPI POST returned non-1 status. Retrying with GET query..."
              PULL_RES=$(curl -s -S -k \
                -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
                --data-urlencode "repository_root=${REPO_PATH}" \
                --data-urlencode "branch=${TARGET_BRANCH}" \
                -G "https://${CLEAN_HOST}:2083/execute/VersionControl/update" 2>&1 || true)
            fi

            echo "cPanel Pull Raw Response:"
            echo "$PULL_RES"
            echo "--- PULL for ${DOMAIN} ---" >> cpanel_debug.log
            echo "$PULL_RES" >> cpanel_debug.log

            if echo "$PULL_RES" | grep -qE '"status"\s*:\s*1'; then
              echo "✅ Git pull succeeded via cPanel UAPI."

              # Step 2: Trigger .cpanel.yml deployment task
              echo "Triggering .cpanel.yml deployment task for ${REPO_PATH}..."
              DEPLOY_RES=$(curl -s -S -k \
                -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
                --data-urlencode "repository_root=${REPO_PATH}" \
                "https://${CLEAN_HOST}:2083/execute/VersionControlDeployment/create" 2>&1 || true)

              if ! echo "$DEPLOY_RES" | grep -qE '"status"\s*:\s*1'; then
                DEPLOY_RES=$(curl -s -S -k \
                  -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
                  --data-urlencode "repository_root=${REPO_PATH}" \
                  -G "https://${CLEAN_HOST}:2083/execute/VersionControlDeployment/create" 2>&1 || true)
              fi

              echo "cPanel Deploy Raw Response:"
              echo "$DEPLOY_RES"
              echo "--- DEPLOY for ${DOMAIN} ---" >> cpanel_debug.log
              echo "$DEPLOY_RES" >> cpanel_debug.log

              if echo "$DEPLOY_RES" | grep -qE '"status"\s*:\s*1'; then
                echo "✅ cPanel deployment task successfully queued for ${DOMAIN}."
                DEPLOYED=true
              fi
            else
              echo "⚠️ cPanel UAPI git pull did not succeed."
            fi
          fi

          # -----------------------------------------------------------
          # Strategy 2: Direct SSH Clean Pull Fallback
          # -----------------------------------------------------------
          if [ "$DEPLOYED" = false ] && [ -n "${CPANEL_SSH_KEY}" ]; then
            echo "=========================================================="
            echo "Initiating direct SSH deployment fallback for ${REPO_PATH}..."
            echo "=========================================================="

            install -m 700 -d ~/.ssh
            printf '%s\n' "${CPANEL_SSH_KEY}" > ~/.ssh/cpanel_key
            chmod 600 ~/.ssh/cpanel_key

            SSH_PORT="${CPANEL_PORT}"
            if [[ "$SSH_PORT" == "2083" || "$SSH_PORT" == "2087" ]]; then
              SSH_PORT="22"
            fi

            SSH_HOST="${CLEAN_HOST}"
            ssh-keyscan -T 15 -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
            chmod 600 ~/.ssh/known_hosts

            cat > ~/.ssh/config <<EOF
          Host cpanel-direct
            HostName ${SSH_HOST}
            User ${CPANEL_USER}
            Port ${SSH_PORT}
            IdentityFile ~/.ssh/cpanel_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
            BatchMode yes
          EOF

            ssh cpanel-direct <<REMOTE_DEPLOY
            set -e
            cd "${REPO_PATH}"
            echo "Connected to \$(pwd). Cleaning working tree..."
            git checkout -- . || true
            git clean -fd -e prisma/dev.db -e .env -e public/uploads || true
            echo "Fetching and resetting to origin/${TARGET_BRANCH}..."
            git fetch origin "${TARGET_BRANCH}"
            git reset --hard "origin/${TARGET_BRANCH}"
            echo "Ensuring runtime directories..."
            mkdir -p tmp prisma public/downloads public/images public/css
            echo "Running zero-build update..."
            if [ -f server-deploy.sh ]; then
              chmod +x server-deploy.sh
              bash server-deploy.sh embeddedindia.in update
            fi
            echo "Touching restart marker..."
            touch tmp/restart.txt
            echo "✅ Direct SSH deployment and Passenger reload complete!"
          REMOTE_DEPLOY

            DEPLOYED=true
          fi

          if [ "$DEPLOYED" = false ]; then
            echo "❌ ERROR: Deployment failed. Neither cPanel UAPI nor SSH could pull changes."
            echo "Verify CPANEL_HOST, CPANEL_API_TOKEN, and CPANEL_SSH_KEY in repository secrets."
            exit 1
          fi

          echo "Waiting 5s for Passenger restart to finish..."
          sleep 5
          echo "🎉 Deployment completed successfully for https://${DOMAIN}."

      - name: Workflow Run Summary & Status Notice
        if: always()
        run: |
          echo "=========================================================="
          echo "GitHub Workflow Job Status: ${{ job.status }}"
          echo "Target Domain: embeddedindia.in"
          echo "Target Notification Email: sahil.kalka@gmail.com"
          echo "=========================================================="

      - name: Upload Debug Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-debug-log
          path: cpanel_debug.log
