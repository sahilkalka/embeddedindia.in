name: Deploy to cPanel

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Select domain(s) to deploy:'
        required: true
        type: choice
        default: 'both (embeddedindia.in & new.embeddedindia.in)'
        options:
          - 'both (embeddedindia.in & new.embeddedindia.in)'
          - 'dev (new.embeddedindia.in -> cpanel dir new)'
          - 'prod (embeddedindia.in -> cpanel dir embeddedindia.in)'

  push:
    branches:
      - main
      - dev
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trigger cPanel Git Pull & Deployment
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_USER: "jiazxebj"
          NOTIFY_EMAIL: "sahil.kalka@gmail.com"
        run: |
          set -e

          # Sanitize host in case secret includes http(s):// or ports
          CLEAN_HOST=$(echo "${CPANEL_HOST}" | sed -e 's|^https\?://||' -e 's|:[0-9]*||' -e 's|/.*||' | tr -d '[:space:]')
          if [ -z "$CLEAN_HOST" ]; then
            CLEAN_HOST="cpanel.embeddedindia.in"
          fi

          echo "Target cPanel Host: https://${CLEAN_HOST}:2083"
          echo "Target cPanel User: ${CPANEL_USER}"

          TARGET_DOMAINS=()

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SELECTED="${{ inputs.target }}"
            case "$SELECTED" in
              *both*)
                TARGET_DOMAINS=("new.embeddedindia.in" "embeddedindia.in")
                ;;
              *new*|*dev*)
                TARGET_DOMAINS=("new.embeddedindia.in")
                ;;
              *embeddedindia.in*|*prod*)
                TARGET_DOMAINS=("embeddedindia.in")
                ;;
              *)
                TARGET_DOMAINS=("new.embeddedindia.in" "embeddedindia.in")
                ;;
            esac
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            if echo "$COMMIT_MSG" | grep -qiE '\[both\]|\[deploy both\]'; then
              TARGET_DOMAINS=("new.embeddedindia.in" "embeddedindia.in")
            elif [ "${{ github.ref }}" = "refs/heads/dev" ] || [ "${{ github.ref }}" = "refs/heads/develop" ]; then
              TARGET_DOMAINS=("new.embeddedindia.in")
            elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
              TARGET_DOMAINS=("embeddedindia.in")
            else
              TARGET_DOMAINS=("new.embeddedindia.in")
            fi
          fi

          CURRENT_REF="${{ github.ref }}"
          CURRENT_BRANCH="${{ github.ref_name }}"
          if [ -z "$CURRENT_BRANCH" ]; then
            CURRENT_BRANCH="main"
          fi

          echo "Triggered by: ${{ github.event_name }} on branch '${CURRENT_BRANCH}'"
          echo "Target deployment list: ${TARGET_DOMAINS[*]}"

          for DOMAIN in "${TARGET_DOMAINS[@]}"; do
            if [ "$DOMAIN" = "new.embeddedindia.in" ]; then
              REPO_DIR="new"
              if [ "$CURRENT_BRANCH" = "dev" ] || [ "$CURRENT_BRANCH" = "develop" ]; then
                TARGET_BRANCH="dev"
              else
                TARGET_BRANCH="${CURRENT_BRANCH}"
              fi
            else
              REPO_DIR="embeddedindia.in"
              TARGET_BRANCH="main"
            fi

            REPO_PATH="/home/${CPANEL_USER}/${REPO_DIR}"
            echo "=========================================================="
            echo "🚀 Target: https://${DOMAIN}"
            echo "📁 cPanel Directory: ${REPO_PATH}"
            echo "🌿 Target Branch: ${TARGET_BRANCH}"
            echo "=========================================================="

            # Step 1: Git Pull / Update from Remote via cPanel UAPI
            # Note: cPanel VersionControl::update requires 'branch' parameter to trigger a git pull from remote
            echo "Triggering cPanel Git pull for ${REPO_PATH} (branch: ${TARGET_BRANCH})..."
            PULL_RES=$(curl -s -S -k \
              -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
              --data-urlencode "repository_root=${REPO_PATH}" \
              --data-urlencode "branch=${TARGET_BRANCH}" \
              -G "https://${CLEAN_HOST}:2083/execute/VersionControl/update" 2>&1)

            echo "cPanel Pull Raw Response:"
            echo "$PULL_RES"

            echo "--- PULL for ${DOMAIN} (branch: ${TARGET_BRANCH}) ---" >> cpanel_debug.log
            echo "$PULL_RES" >> cpanel_debug.log

            # Check if cPanel returned status 1
            if ! echo "$PULL_RES" | grep -qE '"status"\s*:\s*1'; then
              echo "❌ ERROR: cPanel Git pull failed for ${DOMAIN} (${REPO_PATH})!"
              echo "Verify that CPANEL_HOST (${CLEAN_HOST}), CPANEL_API_TOKEN, and repository path exist."
              exit 1
            fi
            echo "✅ Git pull succeeded for ${DOMAIN} (branch: ${TARGET_BRANCH})."

            # Step 2: Trigger .cpanel.yml deployment task
            echo "Triggering .cpanel.yml deployment task for ${REPO_PATH}..."
            DEPLOY_RES=$(curl -s -S -k \
              -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
              --data-urlencode "repository_root=${REPO_PATH}" \
              -G "https://${CLEAN_HOST}:2083/execute/VersionControlDeployment/create" 2>&1)

            echo "cPanel Deploy Raw Response:"
            echo "$DEPLOY_RES"
            echo "--- DEPLOY for ${DOMAIN} ---" >> cpanel_debug.log
            echo "$DEPLOY_RES" >> cpanel_debug.log

            if ! echo "$DEPLOY_RES" | grep -qE '"status"\s*:\s*1'; then
              echo "❌ ERROR: cPanel deployment task failed for ${DOMAIN} (${REPO_PATH})!"
              exit 1
            fi
            echo "✅ cPanel deployment task successfully queued for ${DOMAIN} (${REPO_DIR})."
          done

          echo "Waiting 25s for builds, server-deploy.sh execution, and Passenger restart to finish..."
          sleep 25
          echo "🎉 Deployment tasks completed successfully. server-deploy.sh dispatches email logs to ${NOTIFY_EMAIL}."

      - name: Workflow Run Summary & Status Notice
        if: always()
        run: |
          echo "=========================================================="
          echo "GitHub Workflow Job Status: ${{ job.status }}"
          echo "Trigger: ${{ github.event_name }} (${{ github.ref_name }})"
          echo "Target Notification Email: sahil.kalka@gmail.com"
          echo "=========================================================="

      - name: Upload Debug Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-debug-log
          path: cpanel_debug.log
