- name: Trigger cPanel Git Pull & Deployment via UAPI
        run: |
          echo "--- Pulling latest changes from GitHub into cPanel ---"
          PULL_RES=$(curl -s -k -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/VersionControl/update?repository_root=/home/jiazxebj/embeddedindia.in&branch=main")
          echo "$PULL_RES"
          echo "$PULL_RES" | grep -q '"status":1'

          echo "--- Running .cpanel.yml Deployment Tasks ---"
          DEPLOY_RES=$(curl -s -k -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/VersionControlDeployment/create?repository_root=/home/jiazxebj/embeddedindia.in")
          echo "$DEPLOY_RES"
          echo "$DEPLOY_RES" | grep -q '"status":1'